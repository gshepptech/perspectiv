# Observability stack for the dev loop: `make dev-grafana` / `make dev-grafana-down`.
# Ports come from .env.dev (sourced by scripts/dev.sh); the defaults below
# apply when compose is run by hand.
name: perspectiv-obs

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      # dev.sh renders the scrape target from HTTP_ADDR into PROMETHEUS_CONFIG.
      - ${PROMETHEUS_CONFIG:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    # The Tempo image runs as uid 10001; tmpfs keeps dev traces writable and
    # throwaway without a root-owned volume.
    tmpfs:
      - /var/tempo:uid=10001,gid=10001
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_OTLP_GRPC_PORT:-4317}:4317"

  loki:
    image: grafana/loki:3.6.18
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  grafana:
    image: grafana/grafana:11.6.16
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
