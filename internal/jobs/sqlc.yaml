version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: queries.sql
    gen:
      go:
        package: dbq
        out: dbq
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
