syntax = "proto3";

package perspectiv.v1;

import "google/protobuf/timestamp.proto";
import "perspectiv/v1/enums.proto";
import "perspectiv/v1/user.proto";

// PlaceService reads the place hierarchy, adds user places and lists a
// place's epic. Reads are public.
service PlaceService {
  // Typeahead over place names.
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse);
  rpc GetPlace(GetPlaceRequest) returns (GetPlaceResponse);
  // Drill-down: the children of a place, or the states when parent_id is empty.
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);
  // Adds a MALL or STORE under any place not hidden by moderation.
  rpc CreatePlace(CreatePlaceRequest) returns (CreatePlaceResponse);
  // A place page: arcs at the place and all its descendants, or its tales.
  // Without a place, the arcs of every place: the front page. With a
  // category, only the days at places of that category: the best days at
  // sports and recreation places, everywhere or under a place.
  rpc GetEpic(GetEpicRequest) returns (GetEpicResponse);
  // Follows or unfollows a place: a new story at it or anywhere under it
  // notifies the follower.
  rpc FollowPlace(FollowPlaceRequest) returns (FollowPlaceResponse);
  // The places the caller follows, most recently followed first.
  rpc ListFollowing(ListFollowingRequest) returns (ListFollowingResponse);
  // Public. Unclaimed characters described in stories at the place or
  // anywhere under it whose description contains the query: "were you in
  // someone's story?"
  rpc SearchCharacters(SearchCharactersRequest) returns (SearchCharactersResponse);
  // Public. The categories with at least one readable day at a place of
  // that category, in enum order: the "Browse by kind of place" links.
  rpc ListStoriedCategories(ListStoriedCategoriesRequest) returns (ListStoriedCategoriesResponse);
}

// PlaceRef is a place as a link: id, kind and name.
message PlaceRef {
  string id = 1;
  PlaceKind kind = 2;
  string name = 3;
}

// Place is one node of the STATE > CITY > TOWN > MALL > STORE hierarchy.
message Place {
  string id = 1;
  PlaceKind kind = 2;
  string name = 3;
  // Empty for a STATE.
  string parent_id = 4;
  // IANA time zone, for example America/New_York. An arc's date is the
  // calendar day in this zone.
  string timezone = 5;
  PlaceSource source = 6;
  bool user_added = 7;
  // Ancestors from the STATE down to the parent; empty for a STATE.
  repeated PlaceRef ancestors = 8;
  // What kind of place a store or mall is; UNSPECIFIED for the hierarchy
  // above them and for places added by users.
  PlaceCategory category = 9;
  // Whether the signed-in caller follows the place. Set by GetPlace only.
  bool following = 10;
  // Readable stories at the place and below, counted up to 100, so a
  // search tells same-named entries apart. Set by SearchPlaces only.
  int32 stories = 11;
  // Readable stories at the place and below published in the last seven
  // days by anyone but the caller, counted up to 100. Set by ListFollowing
  // only.
  int32 new_this_week = 12;
}

message SearchPlacesRequest {
  // Required, non-blank. A place name, or a name and the city or town it is
  // in: "starbucks tampa", "tampa starbucks" or "starbucks, tampa".
  string query = 1;
  // Restricts matches to descendants of this place when set.
  string parent_id = 2;
  // Restricts matches to one kind; UNSPECIFIED matches every kind.
  PlaceKind kind = 3;
}

message SearchPlacesResponse {
  repeated Place places = 1;
  // More places match than the result cap returned: the reader narrows the
  // search, for example by adding a town ("starbucks tampa").
  bool more = 2;
  // How the search read the query as a place's name and the city, town or
  // state it is in, so a reader adding the place it did not find starts
  // from that name and that place. Unset when no split named a visible
  // locality, or when a place's name starts with the whole query ("miami
  // beach" is a name, not "beach" in Miami).
  SearchSplit split = 3;
}

// SearchSplit is the first reading of a search as a name and a locality
// whose locality the search found: the one it ranked first.
message SearchSplit {
  // The name part as typed, case kept and spaces collapsed: "joes crab
  // shack" from "joes crab shack tampa".
  string name = 1;
  // The best city, town or state of the locality's name.
  string locality_id = 2;
  // That locality and the places it is in, nearest first: "Tampa,
  // Florida".
  string locality_label = 3;
}

message GetPlaceRequest {
  string place_id = 1;
}

message GetPlaceResponse {
  Place place = 1;
  // Set only for a store or mall with no readable story: the same place
  // listed a second time, where people do write about it. A twin is a
  // visible store or mall with a readable story at it or below whose name
  // matches by placectl dedupe's rule (ancestor suffixes, case and
  // punctuation ignored) and which lies within dedupe's radius of this
  // place (200 m, 2 km when either is a sports venue), or within 2 km when
  // both are filed under the same parent. Both need coordinates. Of
  // several twins, the one with the most stories, then the nearest.
  PlaceRef twin = 2;
}

message ListChildrenRequest {
  // Empty lists the states.
  string parent_id = 1;
  string page_token = 2;
  int32 page_size = 3;
  // Only the children with a readable story at or below them, most recently
  // started arc first: the places a reader is likely to want. One page of
  // page_size, with no next page token.
  bool with_stories = 4;
  // Only children of this category; UNSPECIFIED lists every child.
  PlaceCategory category = 5;
}

message ListChildrenResponse {
  repeated Place places = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message CreatePlaceRequest {
  string name = 1;
  // MALL or STORE only.
  PlaceKind kind = 2;
  string parent_id = 3;
}

message CreatePlaceResponse {
  string place_id = 1;
  Place place = 2;
}

message GetEpicRequest {
  // Empty lists RANKED or NEWEST across every visible place: the front page.
  // TALES needs a place.
  string place_id = 1;
  EpicTab tab = 2;
  string page_token = 3;
  int32 page_size = 4;
  // Reading filter; UNSPECIFIED shows every genre. Applies to TALES, and to
  // arcs through the genres of their perspectives.
  Genre genre = 5;
  // Only the days, or for TALES the stories, whose own place has this
  // category; UNSPECIFIED lists every place. A store's category does not
  // carry to the places above it, so a city is never "food and drink".
  PlaceCategory category = 6;
}

// EpicArc is one arc in a place's epic listing.
message EpicArc {
  string arc_id = 1;
  string title = 2;
  // The place the arc lives at: the epic's place or one of its descendants.
  PlaceRef place = 3;
  // Place-local calendar day, YYYY-MM-DD.
  string local_date = 4;
  // Hour 0 to 23 for an hour arc; unset for a day arc.
  optional int32 hour = 5;
  // Empty when the arc has no canon.
  string canon_lore_id = 6;
  double canon_score = 7;
  int32 member_count = 8;
  int32 perspective_count = 9;
  google.protobuf.Timestamp created_at = 10;
  // The city the arc is in; empty when the place is not under a city.
  string city = 11;
  // The opening of the canon's first story, or of the first story when the
  // arc has no canon.
  string excerpt = 12;
  // The canon lore's name; empty when the arc has no canon or it is unnamed.
  string canon_lore_name = 13;
  // Whether a readable story on the day was published in the last seven
  // days: the window ListFollowing's new_this_week counts in.
  bool new_this_week = 14;
}

// EpicTale is one SOLO or REMOVED perspective in a place's TALES tab.
message EpicTale {
  string perspective_id = 1;
  string arc_id = 2;
  string arc_title = 3;
  PlaceRef place = 4;
  string local_date = 5;
  optional int32 hour = 6;
  UserRef author = 7;
  Genre genre = 8;
  LoreStatus lore_status = 9;
  google.protobuf.Timestamp published_at = 10;
  // The opening of the first part.
  string excerpt = 11;
}

message GetEpicResponse {
  // The epic's own place.
  Place place = 1;
  // Set for RANKED and NEWEST.
  repeated EpicArc arcs = 2;
  // Set for TALES.
  repeated EpicTale tales = 3;
  string next_page_token = 4;
}

message ListStoriedCategoriesRequest {}

message ListStoriedCategoriesResponse {
  repeated PlaceCategory categories = 1;
}

message FollowPlaceRequest {
  string place_id = 1;
  // True follows, false unfollows. Either is a no-op when already so.
  bool on = 2;
}

message FollowPlaceResponse {
  bool following = 1;
}

message ListFollowingRequest {}

message ListFollowingResponse {
  // At most 100 places: those with new stories this week first, most first,
  // then the rest, most recently followed first.
  repeated Place places = 1;
}

message SearchCharactersRequest {
  string place_id = 1;
  // 2 to 60 characters after trimming; matched anywhere in a description,
  // ignoring case.
  string query = 2;
}

// FoundCharacter is one unclaimed character and the story and day it is in.
message FoundCharacter {
  string character_id = 1;
  string label = 2;
  string perspective_id = 3;
  UserRef author = 4;
  string arc_id = 5;
  string arc_title = 6;
  // Place-local calendar day, YYYY-MM-DD.
  string local_date = 7;
  optional int32 hour = 8;
  PlaceRef place = 9;
}

message SearchCharactersResponse {
  // Most recent day first; at most 30.
  repeated FoundCharacter characters = 1;
}
