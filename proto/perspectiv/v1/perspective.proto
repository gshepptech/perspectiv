syntax = "proto3";

package perspectiv.v1;

import "google/protobuf/timestamp.proto";
import "perspectiv/v1/enums.proto";
import "perspectiv/v1/place.proto";
import "perspectiv/v1/react.proto";
import "perspectiv/v1/user.proto";

// PerspectiveService writes and reads perspectives: one user's entry in one
// arc, at most 10 parts of at most 300 words, at most 10 characters.
service PerspectiveService {
  // Creates or replaces the caller's draft (autosave).
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse);
  // Publishes into the arc for the place, day and optional hour, creating the
  // arc in the same transaction when absent.
  rpc Publish(PublishRequest) returns (PublishResponse);
  // Edits a published perspective's text, genre and characters.
  rpc Update(PerspectiveServiceUpdateRequest) returns (PerspectiveServiceUpdateResponse);
  // Soft-deletes; reading views show a placeholder.
  rpc Delete(PerspectiveServiceDeleteRequest) returns (PerspectiveServiceDeleteResponse);
  // Public for published perspectives; drafts only to their author.
  rpc Get(PerspectiveServiceGetRequest) returns (PerspectiveServiceGetResponse);
  // The caller's own drafts and published perspectives.
  rpc ListMine(ListMineRequest) returns (ListMineResponse);
  // Public. One user's published perspectives for their profile, tales
  // (SOLO and REMOVED) included, newest first. Never drafts, deleted or
  // hidden perspectives, or ones at or below a hidden place.
  rpc ListByAuthor(ListByAuthorRequest) returns (ListByAuthorResponse);
  // The author's share link for one of their published perspectives,
  // optionally naming one of its characters. The same perspective and
  // character always give the same link.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // Public. What an invite link shows before sign-in: who wrote, where, when,
  // and the opening of their story. NotFound once the perspective is gone.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  // Saves a story to read later, or unsaves it. Either is a no-op when
  // already so. NotFound when the story is not readable to the caller: a
  // draft, deleted or hidden, or filed at or below a hidden place.
  rpc SavePerspective(SavePerspectiveRequest) returns (SavePerspectiveResponse);
  // The caller's saved stories, most recently saved first. A saved story
  // that is no longer readable is left out until it is readable again.
  rpc ListSaved(ListSavedRequest) returns (ListSavedResponse);
}

// Part is one page of a perspective.
message Part {
  // 1 to 10.
  int32 position = 1;
  string body = 2;
}

// Character is a person described inside a perspective, whom another author
// in the same arc may claim.
message Character {
  string id = 1;
  // 1 to 10.
  int32 position = 2;
  string label = 3;
  // True when a claim on this character is ACCEPTED; such a character cannot
  // be removed.
  bool has_accepted_claim = 4;
  // True when a claim on this character is PENDING.
  bool has_pending_claim = 5;
  // Who this character turned out to be: the claimant of the ACCEPTED claim.
  // Unset when nobody has, or when that account is deleted.
  UserRef claimed_by = 6;
  // The viewer's own claim on this character, if any: PENDING, ACCEPTED or
  // REJECTED. UNSPECIFIED when the viewer has none or is signed out.
  ClaimStatus my_claim = 7;
  // The claimant's own story of the same day, when claimed_by is set and
  // that story is readable; empty otherwise.
  string claimed_by_story_id = 8;
}

// CharacterInput declares a character when saving or publishing.
message CharacterInput {
  // Empty for a new character; the id of an existing one to keep it.
  string id = 1;
  string label = 2;
}

// Perspective is a full perspective with its parts. A deleted or hidden one
// keeps its ids and flags but carries no text, characters or author.
message Perspective {
  string id = 1;
  // Empty while a draft.
  string arc_id = 2;
  // The arc's title. For a draft, the title of the existing day (or hour)
  // arc it would join when published, read when the draft is; empty when
  // publishing it would start that arc.
  string arc_title = 3;
  UserRef author = 4;
  Genre genre = 5;
  PerspectiveStatus status = 6;
  // UNSPECIFIED while a draft.
  LoreStatus lore_status = 7;
  // Empty unless IN_LORE.
  string lore_id = 8;
  // The place, day and optional hour the perspective is (or will be) filed
  // under. Fixed once published.
  PlaceRef place = 9;
  // Place-local calendar day, YYYY-MM-DD.
  string local_date = 10;
  optional int32 hour = 11;
  // Draft only: the title the arc gets if this publish creates it.
  string title_if_new_arc = 12;
  repeated Part parts = 13;
  repeated Character characters = 14;
  int32 upvotes = 15;
  // True when the caller has up-voted it.
  bool voted = 16;
  repeated ReactCount reacts = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp published_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  bool deleted = 21;
  bool hidden = 22;
  // True when the signed-in caller has saved it to read later; false when
  // signed out.
  bool saved = 23;
  // Draft only: the author's own published story in the arc this draft
  // would join, which makes the draft impossible to publish there. Set even
  // when that story is hidden, since a hidden story still holds the slot;
  // empty when there is none.
  string superseded_by_id = 24;
}

// PerspectiveSummary is a perspective as an entry in a listing.
message PerspectiveSummary {
  string id = 1;
  string arc_id = 2;
  UserRef author = 3;
  Genre genre = 4;
  LoreStatus lore_status = 5;
  string lore_id = 6;
  // The opening of the first part; empty when deleted or hidden.
  string excerpt = 7;
  int32 part_count = 8;
  int32 upvotes = 9;
  google.protobuf.Timestamp published_at = 10;
  bool deleted = 11;
  bool hidden = 12;
  // Whether the signed-in caller has upvoted it; false when signed out.
  // Set by GetArc and ListArcSection.
  bool voted = 13;
}

message SaveDraftRequest {
  // Empty creates a new draft.
  string perspective_id = 1;
  string place_id = 2;
  // YYYY-MM-DD, the place-local day the author picked.
  string local_date = 3;
  optional int32 hour = 4;
  string title_if_new_arc = 5;
  Genre genre = 6;
  // Part bodies in order; position is index + 1.
  repeated string parts = 7;
  repeated CharacterInput characters = 8;
}

message SaveDraftResponse {
  Perspective perspective = 1;
}

message PublishRequest {
  // A draft to publish; empty publishes without a saved draft.
  string perspective_id = 1;
  string place_id = 2;
  // YYYY-MM-DD, the place-local day the author picked.
  string local_date = 3;
  // 0 to 23 files under the hour child arc; unset files under the day arc.
  optional int32 hour = 4;
  // Required only when this publish creates the arc.
  string title_if_new_arc = 5;
  Genre genre = 6;
  repeated string parts = 7;
  repeated CharacterInput characters = 8;
  // The invite link the author followed here, if any. It is recorded and
  // the inviter is told only when the publish lands in the invite's arc.
  string invite_code = 9;
}

message PublishResponse {
  string perspective_id = 1;
  string arc_id = 2;
}

message PerspectiveServiceUpdateRequest {
  string perspective_id = 1;
  Genre genre = 2;
  repeated string parts = 3;
  repeated CharacterInput characters = 4;
}

message PerspectiveServiceUpdateResponse {
  Perspective perspective = 1;
}

message PerspectiveServiceDeleteRequest {
  string perspective_id = 1;
}

message PerspectiveServiceDeleteResponse {}

message PerspectiveServiceGetRequest {
  string perspective_id = 1;
}

message PerspectiveServiceGetResponse {
  Perspective perspective = 1;
}

message ListMineRequest {
  // UNSPECIFIED lists drafts and published perspectives.
  PerspectiveStatus status = 1;
  // Optional filters; together they find the caller's perspective for one
  // place and day, which the composer opens after ALREADY_EXISTS.
  string place_id = 2;
  string local_date = 3;
  optional int32 hour = 4;
  string page_token = 5;
  int32 page_size = 6;
}

message ListMineResponse {
  repeated Perspective perspectives = 1;
  string next_page_token = 2;
}

message ListByAuthorRequest {
  // The author, as GetProfile returns them.
  string user_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListByAuthorResponse {
  repeated Perspective perspectives = 1;
  string next_page_token = 2;
}

message CreateInviteRequest {
  string perspective_id = 1;
  // One of the perspective's characters; empty for a plain invite.
  string character_id = 2;
}

message CreateInviteResponse {
  string code = 1;
}

message GetInviteRequest {
  string code = 1;
}

// Invite is the teaser an invite link opens.
message Invite {
  string code = 1;
  UserRef inviter = 2;
  string arc_id = 3;
  string arc_title = 4;
  PlaceRef place = 5;
  // Place-local day, YYYY-MM-DD.
  string local_date = 6;
  optional int32 hour = 7;
  // The opening of the inviter's first part.
  string excerpt = 8;
  // The character the inviter asks about; empty when none.
  string character_label = 9;
}

message GetInviteResponse {
  Invite invite = 1;
}

message SavePerspectiveRequest {
  string perspective_id = 1;
  // True saves, false unsaves.
  bool on = 2;
}

message SavePerspectiveResponse {
  bool saved = 1;
}

message ListSavedRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListSavedResponse {
  // Each saved story as ListByAuthor returns it, so a saved row reads like
  // a profile row.
  repeated Perspective perspectives = 1;
  string next_page_token = 2;
}
