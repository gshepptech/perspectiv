syntax = "proto3";

package perspectiv.v1;

import "google/protobuf/timestamp.proto";
import "perspectiv/v1/enums.proto";
import "perspectiv/v1/lore.proto";
import "perspectiv/v1/perspective.proto";
import "perspectiv/v1/place.proto";
import "perspectiv/v1/user.proto";

// ArcService reads an arc page: canon first, then sublores, then tales.
service ArcService {
  // Public. The arc, its canon, the first page of each list and, for a
  // signed-in caller, where they stand in the arc.
  rpc GetArc(GetArcRequest) returns (GetArcResponse);
  // Public. The next page of one list on an arc page.
  rpc ListArcSection(ListArcSectionRequest) returns (ListArcSectionResponse);
  rpc RetitleHourArc(RetitleHourArcRequest) returns (RetitleHourArcResponse);
}

// Arc is one place and one place-local day, or one hour child of a day arc.
message Arc {
  string id = 1;
  string title = 2;
  PlaceRef place = 3;
  // From the STATE down to the arc's own place.
  repeated PlaceRef place_chain = 4;
  // Place-local calendar day, YYYY-MM-DD.
  string local_date = 5;
  // 0 to 23 for an hour arc; unset for a day arc.
  optional int32 hour = 6;
  // The day arc of an hour arc; empty for a day arc.
  string parent_arc_id = 7;
  // Empty when the arc has no canon.
  string canon_lore_id = 8;
  double canon_score = 9;
  int32 member_count = 10;
  UserRef created_by = 11;
  google.protobuf.Timestamp created_at = 12;
}

// ArcLore is one lore on an arc page with its perspectives.
message ArcLore {
  Lore lore = 1;
  repeated PerspectiveSummary perspectives = 2;
}

// HourArc is one hour child on a day arc's timeline, with its canon.
message HourArc {
  Arc arc = 1;
  // Unset when the hour arc has no canon.
  ArcLore canon = 2;
  int32 perspective_count = 3;
}

message GetArcRequest {
  string arc_id = 1;
  // How many entries each list's first page holds; 0 means the default.
  int32 page_size = 2;
}

// ArcViewer is where the signed-in caller stands in the arc.
message ArcViewer {
  // The caller's published perspective in this arc, in any standing; empty
  // when they have none.
  string perspective_id = 1;
  // The lore that perspective is a member of; empty when none.
  string lore_id = 2;
}

message GetArcResponse {
  Arc arc = 1;
  // Unset when the arc has no canon.
  ArcLore canon = 2;
  // The first page of every other lore that has a member, highest rank
  // first; a demoted lore stays here.
  repeated ArcLore sublores = 3;
  // The first page of SOLO and REMOVED perspectives.
  repeated PerspectiveSummary tales = 4;
  // The first page of published perspectives not yet linked into a lore.
  repeated PerspectiveSummary unlinked = 5;
  // The first page of a day arc's hour children in ascending hour order;
  // empty for an hour arc.
  repeated HourArc hours = 6;
  // Each list's next page, for ListArcSection; empty when it has no more.
  string sublores_next_page_token = 7;
  string tales_next_page_token = 8;
  string unlinked_next_page_token = 9;
  string hours_next_page_token = 10;
  // Set only for a signed-in caller.
  ArcViewer viewer = 11;
}

message ListArcSectionRequest {
  string arc_id = 1;
  ArcSection section = 2;
  // A next page token from GetArc or an earlier ListArcSection.
  string page_token = 3;
  int32 page_size = 4;
}

message ListArcSectionResponse {
  // Set for ARC_SECTION_SUBLORES.
  repeated ArcLore sublores = 1;
  // Set for ARC_SECTION_TALES and ARC_SECTION_UNLINKED.
  repeated PerspectiveSummary perspectives = 2;
  // Set for ARC_SECTION_HOURS.
  repeated HourArc hours = 3;
  string next_page_token = 4;
}

message RetitleHourArcRequest {
  string arc_id = 1;
  string title = 2;
}

message RetitleHourArcResponse {
  Arc arc = 1;
}
