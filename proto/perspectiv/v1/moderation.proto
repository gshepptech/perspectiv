syntax = "proto3";

package perspectiv.v1;

import "google/protobuf/timestamp.proto";
import "perspectiv/v1/enums.proto";
import "perspectiv/v1/user.proto";

// ModerationService takes reports from users and lets admins resolve them.
service ModerationService {
  rpc Report(ReportRequest) returns (ReportResponse);
  // ADMIN only.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  // ADMIN only. Every resolution writes a moderation audit row.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // ADMIN only. The audit log, newest first.
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse);
  // ADMIN only. One account as a moderator needs to see it. A match writes
  // a USER_LOOKUP audit entry.
  rpc LookupUser(LookupUserRequest) returns (LookupUserResponse);
  // ADMIN only. Restores a suspended account's standing; writes an audit
  // entry with the reason.
  rpc LiftSuspension(LiftSuspensionRequest) returns (LiftSuspensionResponse);
  // ADMIN only. Makes a hidden perspective, place or thread post readable
  // again; writes an audit entry with the reason. Claims rejected while it
  // was hidden stay rejected.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // ADMIN only. Makes a store a venue (a mall-level place) so places can be
  // added inside it: a stadium's stands, a park's rides. Its stories and
  // arcs stay where they are. Writes an audit entry with the reason.
  rpc MakeVenue(MakeVenueRequest) returns (MakeVenueResponse);
  // ADMIN only. Merges a duplicate place that has no arcs of its own into
  // its twin: places filed under it move to the twin, and it is hidden.
  // Writes an audit entry with the reason.
  rpc MergePlace(MergePlaceRequest) returns (MergePlaceResponse);
}

// Report is one user report as the admin queue shows it.
message Report {
  string id = 1;
  UserRef reporter = 2;
  ReportTargetKind target_kind = 3;
  string target_id = 4;
  // A short human label for the target: a username, place name or arc title.
  string target_label = 5;
  ReportReason reason = 6;
  string details = 7;
  ReportStatus status = 8;
  // Set once resolved.
  UserRef resolved_by = 9;
  ModerationAction resolution = 10;
  string resolution_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp resolved_at = 13;
  // What the target said when the report was filed (a post, a story's parts
  // and characters, a name, a profile), at most 20,000 characters. It does
  // not change when the author edits the target.
  string reported_text = 14;
}

message ReportRequest {
  ReportTargetKind target_kind = 1;
  string target_id = 2;
  ReportReason reason = 3;
  // Optional free text from the reporter.
  string details = 4;
}

message ReportResponse {
  string report_id = 1;
}

message ListReportsRequest {
  // UNSPECIFIED lists every status.
  ReportStatus status = 1;
  string page_token = 2;
  int32 page_size = 3;
  // When set, only reports against this user: on the account itself, or on
  // a perspective or thread post they wrote.
  string subject_user_id = 4;
  // When set, only reports this user filed.
  string reporter_id = 5;
}

message ListReportsResponse {
  repeated Report reports = 1;
  string next_page_token = 2;
}

message ResolveRequest {
  string report_id = 1;
  ModerationAction action = 2;
  // Why; written to the audit row.
  string reason = 3;
}

message ResolveResponse {
  Report report = 1;
}

// AuditEntry is one audit log row.
message AuditEntry {
  string id = 1;
  // Unset for an action taken from the command line.
  UserRef actor = 2;
  AuditAction action = 3;
  AuditTargetKind target_kind = 4;
  // The target's id, or for an access code the code (target_ref).
  string target_id = 5;
  string target_ref = 6;
  // A short human label for the target, as the report queue shows one.
  string target_label = 7;
  // Set when the action resolved a report.
  string report_id = 8;
  string reason = 9;
  google.protobuf.Timestamp at = 10;
}

message ListAuditLogRequest {
  // UNSPECIFIED lists every action.
  AuditAction action = 1;
  // When set, only what this admin did.
  string actor_id = 2;
  // When set, only actions on this user: on the account itself, or on a
  // perspective or thread post they wrote. Lookups of the account are left
  // out; they read it rather than act on it.
  string subject_user_id = 3;
  string page_token = 4;
  int32 page_size = 5;
}

message ListAuditLogResponse {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

message LookupUserRequest {
  // A username (any case), an email address, or an account id.
  string query = 1;
}

// AdminUserView is one account as a moderator sees it. The email is never
// shown whole.
message AdminUserView {
  string user_id = 1;
  string username = 2;
  // The address with most of its local part masked, as w***@example.com.
  string email_hint = 3;
  bool email_verified = 4;
  Role role = 5;
  google.protobuf.Timestamp joined_at = 6;
  // Set while suspended.
  google.protobuf.Timestamp suspended_at = 7;
  bool deleted = 8;
  // Unset when the account has never signed in.
  google.protobuf.Timestamp last_sign_in_at = 9;
  int32 failed_sign_ins_24h = 10;
  int32 stories = 11;
  int32 hidden_stories = 12;
  int32 open_reports_against = 13;
  int32 reports_against = 14;
  int32 reports_filed = 15;
}

message LookupUserResponse {
  AdminUserView user = 1;
}

message LiftSuspensionRequest {
  string user_id = 1;
  // Why; written to the audit entry.
  string reason = 2;
}

message LiftSuspensionResponse {
  AdminUserView user = 1;
}

message RestoreRequest {
  // PERSPECTIVE, PLACE or LORE_POST.
  AuditTargetKind target_kind = 1;
  string target_id = 2;
  // Why; written to the audit entry.
  string reason = 3;
}

message RestoreResponse {}

message MakeVenueRequest {
  string place_id = 1;
  // Why; written to the audit entry.
  string reason = 2;
}

message MakeVenueResponse {}

message MergePlaceRequest {
  // The duplicate; it must have no arcs of its own.
  string place_id = 1;
  // The place everyone should use.
  string into_place_id = 2;
  // Why; written to the audit entry.
  string reason = 3;
}

message MergePlaceResponse {}
