syntax = "proto3";

package perspectiv.v1;

import "google/protobuf/timestamp.proto";
import "perspectiv/v1/enums.proto";

// AuthService signs users up and in. The access token is returned in the body
// for the browser to hold in memory; the refresh token travels only as an
// HttpOnly cookie and never appears in a message.
service AuthService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Rotates the refresh cookie and returns a new access token.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Changes the caller's password, given the current one, and signs out
  // every other device.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Starts changing the caller's email, given their password: the new
  // address gets a confirmation link and the old one a notice.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Public. Confirms an email change from the link sent to the new address.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);
  // Signs the caller out on every device, this one included.
  rpc SignOutEverywhere(SignOutEverywhereRequest) returns (SignOutEverywhereResponse);
  // Public. Whether signing up needs an access code (the invite-only beta).
  rpc GetSignUpInfo(GetSignUpInfoRequest) returns (GetSignUpInfoResponse);
  // Public. Asks for a place in the beta. Always answers OK, whether or not
  // the address is already on the list, so it reveals nothing about others.
  rpc JoinWaitlist(JoinWaitlistRequest) returns (JoinWaitlistResponse);
  // Admin. Issues a beta access code.
  rpc CreateAccessCode(CreateAccessCodeRequest) returns (CreateAccessCodeResponse);
  // Admin. Beta access codes, newest first.
  rpc ListAccessCodes(ListAccessCodesRequest) returns (ListAccessCodesResponse);
  // Admin. Stops a code admitting anyone more.
  rpc RevokeAccessCode(RevokeAccessCodeRequest) returns (RevokeAccessCodeResponse);
  // Admin. The waitlist, oldest first.
  rpc ListWaitlist(ListWaitlistRequest) returns (ListWaitlistResponse);
  // Admin. Issues a waiting person a single-use code and emails it.
  rpc InviteFromWaitlist(InviteFromWaitlistRequest) returns (InviteFromWaitlistResponse);
}

// SessionUser is the signed-in caller as the web app's session sees it.
message SessionUser {
  string user_id = 1;
  string username = 2;
  Role role = 3;
  bool email_verified = 4;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  // The 18-or-over confirmation; false is rejected.
  bool age_confirmed = 4;
  // While sign-up is invite-only: a beta access code, or the code of a
  // member's invite link. Ignored while sign-up is open.
  string access_code = 5;
  // A field the form hides from people. A value means an automated
  // form-filler: the request is answered as if it worked and no account is
  // made.
  string website = 6;
}

message SignUpResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  SessionUser user = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message RefreshRequest {}

message RefreshResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  SessionUser user = 3;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

// Always empty and always OK, whether or not the email has an account.
message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

message GetSignUpInfoRequest {}

message GetSignUpInfoResponse {
  // True while signing up needs an access code.
  bool invite_only = 1;
}

message JoinWaitlistRequest {
  string email = 1;
  // Optional, up to 300 characters: where they would write about.
  string note = 2;
  // The hidden honeypot, as on SignUpRequest: a value stores nothing.
  string website = 3;
}

message JoinWaitlistResponse {}

// AccessCode is one beta access code.
message AccessCode {
  string code = 1;
  string note = 2;
  int32 max_uses = 3;
  int32 uses = 4;
  google.protobuf.Timestamp created_at = 5;
  // Unset when the code does not expire.
  google.protobuf.Timestamp expires_at = 6;
  bool revoked = 7;
}

message CreateAccessCodeRequest {
  // Lower-case letters, digits and dashes, 4 to 32; empty generates one.
  string code = 1;
  // Up to 200 characters: who it is for.
  string note = 2;
  // 1 to 10,000.
  int32 max_uses = 3;
  // 0 never expires; up to 365.
  int32 expires_in_days = 4;
}

message CreateAccessCodeResponse {
  AccessCode code = 1;
}

message ListAccessCodesRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListAccessCodesResponse {
  repeated AccessCode codes = 1;
  string next_page_token = 2;
}

message RevokeAccessCodeRequest {
  string code = 1;
}

message RevokeAccessCodeResponse {
  AccessCode code = 1;
}

// WaitlistEntry is one person asking to join.
message WaitlistEntry {
  string id = 1;
  // The address masked ("pa•••@example.test"): admins recognise people by
  // it, and the invite itself is emailed by the server, so no full address
  // leaves it.
  string email_hint = 2;
  string note = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset until an admin invites them.
  google.protobuf.Timestamp invited_at = 5;
  // The single-use code they were sent; empty until invited.
  string code = 6;
}

message ListWaitlistRequest {
  // True lists only people not yet invited.
  bool waiting_only = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListWaitlistResponse {
  repeated WaitlistEntry entries = 1;
  string next_page_token = 2;
}

message InviteFromWaitlistRequest {
  string id = 1;
}

message InviteFromWaitlistResponse {
  WaitlistEntry entry = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message RequestEmailChangeRequest {
  string new_email = 1;
  string current_password = 2;
}

message RequestEmailChangeResponse {}

message ConfirmEmailChangeRequest {
  string token = 1;
}

message ConfirmEmailChangeResponse {}

message SignOutEverywhereRequest {}

message SignOutEverywhereResponse {}
