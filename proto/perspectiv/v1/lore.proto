syntax = "proto3";

package perspectiv.v1;

import "google/protobuf/timestamp.proto";
import "perspectiv/v1/enums.proto";
import "perspectiv/v1/user.proto";

// LoreService handles claims on characters and reads lore membership.
service LoreService {
  // Claims a character in another perspective in the same arc: "that was me".
  rpc ClaimCharacter(ClaimCharacterRequest) returns (ClaimCharacterResponse);
  // The character's author accepts or rejects a PENDING claim.
  rpc ResolveClaim(ResolveClaimRequest) returns (ResolveClaimResponse);
  // The caller's incoming or outgoing claims.
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse);
  // Public. One lore with its members and encounters.
  rpc GetLore(GetLoreRequest) returns (GetLoreResponse);
  // Public. A lore's thread: its top-level posts in the requested order,
  // each with its first replies.
  rpc ListLorePosts(ListLorePostsRequest) returns (ListLorePostsResponse);
  // Posts to a lore's thread, or replies to a post in it: a lore member, or
  // anyone with a perspective in the lore's arc. Plain text, 1 to 1,000
  // characters.
  rpc AddLorePost(AddLorePostRequest) returns (AddLorePostResponse);
  // Names a lore: any member of it, 1 to 60 characters after trimming. The
  // latest name wins.
  rpc NameLore(NameLoreRequest) returns (NameLoreResponse);
  // Public. The replies under one top-level post, oldest first.
  rpc ListLorePostReplies(ListLorePostRepliesRequest) returns (ListLorePostRepliesResponse);
  // Sets or clears the caller's upvote on a thread post. The same people who
  // may post may vote, never on their own post.
  rpc VoteLorePost(VoteLorePostRequest) returns (VoteLorePostResponse);
  // Rewrites the caller's own post; the post then shows as edited.
  rpc EditLorePost(EditLorePostRequest) returns (EditLorePostResponse);
  // Deletes the caller's own post. A top-level post with replies stays as
  // "[deleted]" above them.
  rpc DeleteLorePost(DeleteLorePostRequest) returns (DeleteLorePostResponse);
}

// Claim is one author saying a character in another author's perspective was
// them.
message Claim {
  string id = 1;
  string arc_id = 2;
  string character_id = 3;
  string character_label = 4;
  // The perspective that declares the character, and its author.
  string perspective_id = 5;
  UserRef author = 6;
  // The claimant and the claimant's perspective in the same arc.
  UserRef claimant = 7;
  string claimant_perspective_id = 8;
  ClaimStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp resolved_at = 11;
  // The opening of the claimant's story, about 240 characters cut at a word
  // and ending in "…" when cut. Empty when that story is not readable:
  // deleted, hidden, unpublished, or filed at or below a hidden place.
  string claimant_excerpt = 12;
  // Where and when the story declaring the character is set: its place's
  // name, the place-local day (YYYY-MM-DD) and the hour (unset for a day),
  // so a request can name the story it is about.
  string place_name = 13;
  string local_date = 14;
  optional int32 hour = 15;
}

// Encounter is an accepted claim seen as a link between two perspectives.
message Encounter {
  string claim_id = 1;
  // The perspective declaring the claimed character.
  string perspective_id = 2;
  string claimant_perspective_id = 3;
}

// LoreMember is one perspective in a lore and its author.
message LoreMember {
  string perspective_id = 1;
  UserRef user = 2;
}

// Lore is a connected web of two or more linked perspectives in one arc.
message Lore {
  string id = 1;
  string arc_id = 2;
  LoreStanding standing = 3;
  int32 member_count = 4;
  // UP votes across the lore's perspectives.
  int32 upvotes = 5;
  // log(1 + members) * log(1 + upvotes), as of computed_at.
  double rank_score = 6;
  google.protobuf.Timestamp computed_at = 7;
  repeated LoreMember members = 8;
  repeated Encounter encounters = 9;
  // Empty until a member names the lore; readers then see it as its title.
  string name = 10;
  // Who set the current name; unset when there is none.
  UserRef named_by = 11;
  // Posts a reader of the thread sees, replies included: never a deleted or
  // hidden post, a post by a deleted account, or a reply under a hidden post.
  int32 post_count = 12;
}

message ClaimCharacterRequest {
  string character_id = 1;
}

message ClaimCharacterResponse {
  string claim_id = 1;
  ClaimStatus status = 2;
}

message ResolveClaimRequest {
  string claim_id = 1;
  bool accept = 2;
}

message ResolveClaimResponse {
  ClaimStatus status = 1;
}

message ListClaimsRequest {
  ClaimDirection direction = 1;
  // UNSPECIFIED lists every status.
  ClaimStatus status = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message ListClaimsResponse {
  repeated Claim claims = 1;
  string next_page_token = 2;
}

message GetLoreRequest {
  string lore_id = 1;
}

message GetLoreResponse {
  Lore lore = 1;
}

// LorePost is one message in a lore's thread: a top-level post, or a reply
// under one.
message LorePost {
  string id = 1;
  // Unset when deleted.
  UserRef author = 2;
  // Empty when deleted.
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  // True when the author is a member of the lore, as opposed to another
  // writer in the arc.
  bool by_member = 5;
  // The top-level post this reply sits under; empty for a top-level post.
  string reply_to_id = 6;
  // On a reply that answered another reply: that reply's author, for
  // "replying to @name". Unset when it answered the top-level post, or when
  // the reply it answered is gone.
  UserRef replying_to = 7;
  // Set once the author edits the post.
  google.protobuf.Timestamp edited_at = 8;
  int32 upvotes = 9;
  // Whether the signed-in caller holds an upvote on it.
  bool viewer_upvoted = 10;
  // A top-level post its author deleted that stays for its replies. It has
  // no author, body or upvote.
  bool deleted = 11;
  // On a top-level post: how many readable replies it has, and the first
  // three of them, oldest first.
  int32 reply_count = 12;
  repeated LorePost replies = 13;
  // The ListLorePostReplies page token for the replies after `replies`;
  // empty when they are all here.
  string more_replies_token = 14;
}

message ListLorePostsRequest {
  string lore_id = 1;
  string page_token = 2;
  int32 page_size = 3;
  // UNSPECIFIED reads as TOP. A page token only continues the order it was
  // made for.
  LorePostSort sort = 4;
}

message ListLorePostsResponse {
  // Top-level posts.
  repeated LorePost posts = 1;
  string next_page_token = 2;
}

message AddLorePostRequest {
  string lore_id = 1;
  string body = 2;
  // The post being answered, top-level or a reply in the same thread; empty
  // for a new top-level post. A reply to a reply sits under the same
  // top-level post.
  string reply_to_id = 3;
}

message AddLorePostResponse {
  LorePost post = 1;
}

message NameLoreRequest {
  string lore_id = 1;
  string name = 2;
}

message NameLoreResponse {
  // The name as stored, trimmed.
  string name = 1;
}

message ListLorePostRepliesRequest {
  // A top-level post.
  string post_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListLorePostRepliesResponse {
  repeated LorePost replies = 1;
  string next_page_token = 2;
}

message VoteLorePostRequest {
  string post_id = 1;
  // True sets the upvote; false clears it.
  bool on = 2;
}

message VoteLorePostResponse {
  int32 upvotes = 1;
  bool on = 2;
}

message EditLorePostRequest {
  string post_id = 1;
  string body = 2;
}

message EditLorePostResponse {
  LorePost post = 1;
}

message DeleteLorePostRequest {
  string post_id = 1;
}

message DeleteLorePostResponse {}
