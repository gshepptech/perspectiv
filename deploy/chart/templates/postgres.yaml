{{- $name := include "perspectiv.postgresHost" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "perspectiv.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "perspectiv.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "perspectiv.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $name }}
  replicas: 1
  # The data volume survives a helm uninstall and a StatefulSet delete.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "perspectiv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "perspectiv.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # uid and gid 70 are the postgres user of the alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- with .Values.postgres.settings }}
          args:
            {{- range $k, $v := . }}
            - "-c"
            - {{ printf "%s=%v" $k $v | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: perspectiv
            - name: POSTGRES_DB
              value: perspectiv
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "perspectiv.secret" . }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "perspectiv", "-d", "perspectiv", "-h", "127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "perspectiv", "-d", "perspectiv", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            {{- include "perspectiv.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker
            # and declare /var/lib/postgresql as the volume.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            {{- if .Values.postgres.backup.enabled }}
            # The backups volume binds on its first consumer (local-path is
            # WaitForFirstConsumer); mounting it here binds it at install, on
            # the database's node, so helm --wait does not stall on it.
            - name: backups
              mountPath: /backups
              readOnly: true
            {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.postgres.backup.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "perspectiv.fullname" . }}-postgres-backups
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
# Only the app, the migration Job and the backup Job may reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "perspectiv.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "perspectiv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "worker", "migrate", "backup"]
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
