apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perspectiv.fullname" . }}-env
  labels:
    {{- include "perspectiv.labels" . | nindent 4 }}
data:
  HTTP_ADDR: ":8080"
  PUBLIC_BASE_URL: {{ default (printf "https://%s" (include "perspectiv.host" .)) .Values.app.publicBaseURL | quote }}
  # Production is served only over TLS, so the refresh cookie is always Secure.
  COOKIE_SECURE: "true"
  MAIL_PROVIDER: {{ .Values.app.mail.provider | quote }}
  MAIL_FROM: {{ required "app.mail.from is required" .Values.app.mail.from | quote }}
  SMTP_ADDR: {{ .Values.app.mail.smtpAddr | quote }}
  RANK_INTERVAL: {{ .Values.app.rankInterval | quote }}
  CANON_MIN_MEMBERS: {{ .Values.app.canonMinMembers | quote }}
  DB_MAX_CONNS: {{ .Values.app.dbMaxConns | quote }}
  SIGNUP_MODE: {{ .Values.app.signupMode | quote }}
  EXPIRY_WINDOW: {{ .Values.app.expiryWindow | quote }}
  AVATAR_DIR: /var/lib/perspectiv/avatars
  # Migrations run in the migration Job, never on pod start.
  MIGRATE_ON_START: "false"
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.app.otlpEndpoint | quote }}
